<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#18181B" stroke="#27272A" stroke-width="2"/>
  <!-- Glowing shadow -->
  <polygon points="34,32 66,32 53,49 74,49 46,73 52,58 28,58 42,44 24,44" fill="#8B5CF6" opacity="0.4" filter="url(#glow)"/>
  <!-- Main Bolt -->
  <polygon points="34,32 66,32 53,49 74,49 46,73 52,58 28,58 42,44 24,44" fill="url(#purpleBolt)"/>
</svg>